name: validate
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
jobs:
  plugin-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate .
  go-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: skills/lodestone/references/toolkit/harness/go.mod
      - run: go test ./... && go vet ./...
        working-directory: skills/lodestone/references/toolkit/harness
